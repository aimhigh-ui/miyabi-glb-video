.n{position:absolute;width:max-content;max-width:340px;font-size:15px;line-height:1.6;padding:2px 2px 4px;border-bottom:2px solid var(--c);cursor:default;white-space:normal;word-break:normal;overflow-wrap:anywhere}

    if (n.depth > 0 && hasKids(n)) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tg" + (n.side < 0 ? " lft" : ""); b.style.setProperty("--c", `var(${n.color})`);
      b.addEventListener("click", e => { e.stopPropagation(); toggle(n); });
      nodesEl.appendChild(b); n.tg = b;
    }
  });
}

const isOpen = n => !closed.has(n.id);
function visible(n){ for(let p=n.parent; p; p=p.parent) if(!isOpen(p)) return false; return true; }
const boxed = n => n.depth<=1 || !!n.v;

function layout(){
  all.forEach(n => { const v = visible(n); n.el.hidden = !v; if (n.tg) n.tg.hidden = !v; });
  all.forEach(n => { if (!n.el.hidden){ n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; } });
  const stackH = kids => kids.reduce((s,k,i)=>s + k.band + (i?VGAP:0), 0);
  function band(n){
    const kids = isOpen(n) ? (n.c||[]) : [];
    kids.forEach(band);
    n.kidsH = stackH(kids); n.band = Math.max(n.h, n.kidsH); return n.band;
  }
  function place(n, x, top, dir){
    n.x = x; n.y = top + (n.band - n.h)/2;
    const kids = isOpen(n) ? (n.c||[]) : [];
    let y = top + (n.band - n.kidsH)/2;
    kids.forEach(k => { place(k, dir > 0 ? n.x + n.w + HGAP : n.x - HGAP - k.w, y, dir); y += k.band + VGAP; });
  }
  // 中心：右の枝と左の枝を、それぞれ上下の真ん中にそろえる
  const R = (MAP.c||[]).filter(k => k.side > 0), L = (MAP.c||[]).filter(k => k.side < 0);
  [...R, ...L].forEach(band);
  const rh = stackH(R), lh = stackH(L), H = Math.max(MAP.h, rh, lh);
  MAP.x = 0; MAP.y = (H - MAP.h)/2; MAP.band = H;
  let y = (H - rh)/2; R.forEach(k => { place(k, MAP.w + HGAP, y, 1); y += k.band + VGAP; });
  y = (H - lh)/2;     L.forEach(k => { place(k, -HGAP - k.w, y, -1); y += k.band + VGAP; });
  let minX = 0, maxX = MAP.w;
  all.forEach(n => { if (!n.el.hidden){ minX = Math.min(minX, n.x - (n.tg && n.side < 0 ? 30 : 0)); maxX = Math.max(maxX, n.x + n.w + (n.tg && n.side > 0 ? 30 : 0)); } });
  const off = 20 - minX;
  all.forEach(n => { if (!n.el.hidden) n.x += off; });
  const W = maxX - minX + 40, svg = document.getElementById("edges");
  svg.innerHTML = "";
  all.forEach(n => {
    if (n.el.hidden) return;
    n.el.style.left = n.x+"px"; n.el.style.top = n.y+"px";
    const yAt = m => boxed(m) ? m.y + m.h/2 : m.y + m.h;
    if (n.tg){
      n.tg.style.left = (n.side > 0 ? n.x + n.w : n.x) + "px"; n.tg.style.top = yAt(n) + "px";
      const open = isOpen(n);
      n.tg.textContent = open ? "−" : "+" + countAll(n);
      n.tg.classList.toggle("shut", !open);
      n.tg.setAttribute("aria-expanded", String(open));
      n.tg.setAttribute("aria-label", (open ? "閉じる：" : "開く：") + n.t);
    }
    if (n.parent && !n.parent.el.hidden){
      const p = n.parent, root = p.depth === 0;
      const px = n.side > 0 ? p.x + p.w + (root ? 0 : 18) : p.x - (root ? 0 : 18), py = yAt(p);
      const cx = n.side > 0 ? n.x : n.x + n.w, cy = yAt(n), mx = (px + cx)/2;
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", `M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      path.style.stroke = `var(${n.color})`;
      svg.appendChild(path);
    }
  });
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  world.style.width = W+"px"; world.style.height = H+"px";
  mapW = W; mapH = H;
}
// 開け閉め。開く時は、同じ段のほかの枝を閉じる
function toggle(n){
  const bx = n.x, by = n.y;
  if (isOpen(n)) closed.add(n.id);
  else {
    closed.delete(n.id);
    (n.parent ? n.parent.c : []).forEach(k => { if (k !== n && hasKids(k)) closed.add(k.id); });
  }
  saveClosed(); layout();
  tx += (bx - n.x) * s; ty += (by - n.y) * s; apply(); // 押した所が画面の上で動かないようにする
  if (isOpen(n)) reveal(n);
}
// 開いた枝が画面に入るように動かす（大きさは変えない）
function reveal(n){
  const r = vp.getBoundingClientRect(), pad = 24;
  let x0 = n.x, y0 = n.y, x1 = n.x + n.w, y1 = n.y + n.h;
  (function walk(m){ (isOpen(m) ? m.c||[] : []).forEach(k => { x0 = Math.min(x0,k.x); y0 = Math.min(y0,k.y); x1 = Math.max(x1,k.x+k.w); y1 = Math.max(y1,k.y+k.h); walk(k); }); })(n);
  const L = x0*s + tx, T = y0*s + ty, Rr = x1*s + tx, B = y1*s + ty;
  let dx = 0, dy = 0;
  if ((x1-x0)*s > r.width - pad*2) dx = (n.side < 0 ? r.width - pad - Rr : pad - L);
  else if (L < pad) dx = pad - L; else if (Rr > r.width - pad) dx = r.width - pad - Rr;
  if ((y1-y0)*s > r.height - pad*2) dy = pad - T;
  else if (T < pad) dy = pad - T; else if (B > r.height - pad) dy = r.height - pad - B;
  if (!dx && !dy) return;
  world.classList.add("anim"); tx += dx; ty += dy; apply();
  setTimeout(()=>world.classList.remove("anim"), 300);
}

// 動かす・拡大
const vp = document.getElementById("vp"), world = document.getElementById("world");
let s = 1, tx = 30, ty = 30, mapW = 0, mapH = 0;
function apply(){ world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; document.getElementById("zPct").textContent = Math.round(s*100)+"%"; }
function zoomAt(f, cx, cy){
  const ns = Math.min(2, Math.max(0.2, s*f)); f = ns/s;
  tx = cx - (cx - tx)*f; ty = cy - (cy - ty)*f; s = ns; apply();
}
function fit(){
  const r = vp.getBoundingClientRect();
  s = Math.min(1, Math.max(0.2, Math.min((r.width-40)/mapW, (r.height-40)/mapH)));
  tx = (r.width - mapW*s)/2; ty = (r.height - mapH*s)/2; apply();
}
function centerOn(n){
  const r = vp.getBoundingClientRect();
  world.classList.add("anim");
  tx = r.width/2 - (n.x + n.w/2)*s; ty = r.height/2 - (n.y + n.h/2)*s; apply();
  setTimeout(()=>world.classList.remove("anim"), 300);
}
document.getElementById("zIn").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.2, r.width/2, r.height/2); };
document.getElementById("zOut").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1/1.2, r.width/2, r.height/2); };
document.getElementById("zFit").onclick = fit;
vp.addEventListener("wheel", e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY*0.01), e.clientX - r.left, e.clientY - r.top);
  else { tx -= e.shiftKey ? e.deltaY : e.deltaX; ty -= e.shiftKey ? 0 : e.deltaY; apply(); }
}, { passive:false });
// ドラッグで動かす。動かさずに離したら、押した文字の枝を開け閉めする
const pts = new Map(); let last = null, pinch = null, downAt = null, downNode = null, moved = false;
vp.addEventListener("pointerdown", e => {
  if (e.target.closest("a,button")) return;
  const el = e.target.closest(".n.has");
  downNode = el ? el._node : null; downAt = {x:e.clientX, y:e.clientY}; moved = false;
  vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 1){ last = {x:e.clientX, y:e.clientY}; vp.classList.add("drag"); }
  if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = Math.hypot(a.x-b.x, a.y-b.y); moved = true; }
});
vp.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6) moved = true;
  if (pts.size === 2 && pinch){
    const [a,b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y), r = vp.getBoundingClientRect();
    zoomAt(d/pinch, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top); pinch = d; return;
  }
  if (last){ tx += e.clientX - last.x; ty += e.clientY - last.y; last = {x:e.clientX, y:e.clientY}; apply(); }
});
const up = e => {
  const tap = e.type === "pointerup" && pts.size === 1 && !moved && downNode;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!pts.size){ last = null; vp.classList.remove("drag"); }
  if (tap) toggle(downNode);
  if (!pts.size){ downNode = null; downAt = null; }
};
vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);

// 全部開く・たたむ
document.getElementById("openAll").onclick = () => { closed.clear(); saveClosed(); layout(); fit(); };
document.getElementById("closeAll").onclick = () => { closed = defaultClosed(); saveClosed(); start(); };

// 探す
const q = document.getElementById("q"), hits = document.getElementById("hits");
q.addEventListener("input", () => {
  const w = q.value.trim().toLowerCase();
  all.forEach(n => n.el.classList.remove("hit"));
  if (!w){ hits.textContent = ""; renderOutline(); return; }
  const found = all.filter(n => (n.t + " " + (n.m||"") + " " + (n.sub||"")).toLowerCase().includes(w));
  found.forEach(n => { for (let p=n.parent; p; p=p.parent) closed.delete(p.id); n.el.classList.add("hit"); });
  hits.textContent = found.length ? found.length + "件" : "見つかりません";
  layout(); if (found[0]) centerOn(found[0]);
  renderOutline(w);
});

// 一覧の表示（枝は押すと開く。探している時は、当たった所まで開く）
function renderOutline(w){
  const box = document.getElementById("outline");
  const hitOf = n => !!w && (n.t + " " + (n.m||"")).toLowerCase().includes(w);
  const anyHit = n => hitOf(n) || (n.c||[]).some(anyHit);
  const li = n => {
    const meta = n.m ? `<span class="meta">${esc(n.m)}</span>` : "";
    const body = n.v ? `<a href="${yt(n.v)}" target="_blank" rel="noopener">${esc(n.t)}</a>${meta}`
      : esc(disp(n)) + (n.u ? ` <a class="lnk" href="${esc(n.u)}" target="_blank" rel="noopener">${lnkLabel(n.u)}</a>` : "");
    const mark = hitOf(n) ? ' style="background:var(--hit)"' : "";
    const cls = n.depth===1 ? "o1" : "";
    if (!hasKids(n)) return `<li class="${cls}" style="--c:var(${n.color})"><div${mark}>${body}</div></li>`;
    const open = w && (n.c||[]).some(anyHit) ? " open" : "";
    return `<li class="${cls}" style="--c:var(${n.color})"><details${open}><summary><span${mark}>${body}</span><span class="cnt">${countAll(n)}</span></summary><ul>${n.c.map(li).join("")}</ul></details></li>`;
  };
  box.innerHTML = `<ul><li><div class="o0"><b>${esc(MAP.t)}</b>${MAP.sub ? "：" + esc(MAP.sub) : ""}${(MAP.notes||[]).map(t => `<span class="meta" style="display:block;margin:4px 0 0">※${esc(t)}</span>`).join("")}</div><ul>${(MAP.c||[]).map(li).join("")}</ul></li></ul>`;
}
function setView(m){
  const out = m === "out";
  document.getElementById("vp").hidden = out; document.getElementById("outline").hidden = !out;
  document.getElementById("vMap").setAttribute("aria-pressed", String(!out));
  document.getElementById("vOut").setAttribute("aria-pressed", String(out));
  store.set("miyabimap-view", m);
  if (!out){ layout(); }
}
document.getElementById("vMap").onclick = () => { setView("map"); start(); };
document.getElementById("vOut").onclick = () => setView("out");

// 2つのマップの切り替え
function showMap(k){
  which = k; store.set("miyabimap-which", k);
  try { history.replaceState(null, "", k === "b" ? "#design" : "#goal"); } catch(e){}
  document.getElementById("mA").setAttribute("aria-pressed", String(k === "a"));
  document.getElementById("mB").setAttribute("aria-pressed", String(k === "b"));
  q.value = ""; hits.textContent = "";
  build(); renderOutline();
  if (!document.getElementById("vp").hidden) start();
}
document.getElementById("mA").onclick = () => showMap("a");
document.getElementById("mB").onclick = () => showMap("b");

// 全体を収める。字が小さくなりすぎる時（85%未満）は、85%で中心を真ん中に出す
function start(){
  layout(); fit();
  if (s < MINS){ s = MINS; centerOn(MAP); }
}
function init(){
  showMap(which);
  if (store.get("miyabimap-view") === "out") setView("out");
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(init); else init();
// 字の形（Webフォント）が後から届くと字の高さが変わるので、届いたら並べ直す（枝どうしが重ならないように）
const relayout = () => { if (!all.length || document.getElementById("vp").hidden) return; const bx = MAP.x, by = MAP.y; layout(); tx += (bx - MAP.x)*s; ty += (by - MAP.y)*s; apply(); };
if (document.fonts) document.fonts.addEventListener("loadingdone", relayout);
window.addEventListener("load", relayout);
</script>

</body></html>
